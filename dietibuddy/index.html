<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DietiBuddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#F4F6F2;--panel:#FFFFFF;--ink:#13231A;
    --forest:#163D2A;--forest-2:#1F5238;--leaf:#3E9161;--leaf-deep:#2E7449;--leaf-soft:#E7F0E7;
    --amber:#E2A24A;--amber-deep:#C4822B;--amber-soft:#FBEFD8;
    --rose:#D97066;--rose-soft:#FBE7E4;--blue:#4E7FB0;--blue-soft:#E4EDF5;--violet:#6E5DA3;--violet-soft:#ECE7F6;
    --muted:#5C6C60;--faint:#8A968C;--line:#E5E9E0;--line-strong:#D4DBCE;
    --sh-sm:0 1px 2px rgba(20,40,28,.05),0 2px 6px rgba(20,40,28,.04);
    --sh-md:0 4px 14px rgba(20,40,28,.07),0 12px 34px rgba(20,40,28,.07);
    --sh-lg:0 10px 30px rgba(20,40,28,.10),0 40px 90px rgba(20,40,28,.14);
    --serif:"Fraunces",Georgia,serif;--sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--radius:16px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;}
  ::selection{background:var(--amber-soft);}
  a{color:inherit;text-decoration:none;}
  svg{display:block;}
  button{font-family:inherit;cursor:pointer;}
  h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:500;}
  input,select,textarea{font-family:var(--sans);font-size:.9rem;color:var(--ink);}
  .ico{flex:0 0 auto;}
  :focus-visible{outline:2.5px solid var(--leaf-deep);outline-offset:2px;border-radius:8px;}
  [hidden]{display:none !important;}

  .view{display:none;}
  .view.active{display:block;}

  /* ===== buttons ===== */
  .btn{display:inline-flex;align-items:center;gap:.5em;font-family:var(--sans);font-weight:600;font-size:.92rem;border-radius:100px;padding:.7em 1.2em;border:1px solid transparent;transition:transform .16s,box-shadow .16s,background .16s,color .16s,border-color .16s;line-height:1;white-space:nowrap;}
  .btn svg{width:16px;height:16px;stroke-width:2;}
  .btn-primary{background:var(--amber);color:#3a2708;box-shadow:0 6px 16px rgba(196,130,43,.26);}
  .btn-primary:hover{background:#EAAE5C;transform:translateY(-2px);}
  .btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-strong);}
  .btn-ghost:hover{border-color:var(--forest);transform:translateY(-2px);}
  .btn-dark{background:var(--forest);color:#eef3ec;}
  .btn-dark:hover{background:var(--forest-2);transform:translateY(-2px);}
  .btn-sm{display:inline-flex;align-items:center;gap:.5em;font-weight:600;font-size:.85rem;border-radius:100px;padding:.55em 1em;border:1px solid var(--line-strong);background:#fff;color:var(--ink);transition:all .15s;font-family:var(--sans);}
  .btn-sm:hover{border-color:var(--forest);}
  .btn-sm.dark{background:var(--forest);border-color:var(--forest);color:#eef3ec;}
  .btn-sm.dark:hover{background:var(--forest-2);}
  .btn-sm.amber{background:var(--amber);border-color:var(--amber);color:#3a2708;}
  .btn-sm svg{width:15px;height:15px;stroke-width:1.9;}

  /* ================= LANDING ================= */
  .lnav{position:sticky;top:0;z-index:40;background:rgba(244,246,242,.82);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s;}
  .lnav.scrolled{border-color:var(--line);}
  .lnav__in{max-width:1180px;margin:0 auto;padding:0 28px;height:68px;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:.55em;font-family:var(--sans);font-weight:700;font-size:1.12rem;letter-spacing:-.01em;background:none;border:0;}
  .brand svg{width:30px;height:30px;flex:0 0 auto;}
  .lnav__links{display:flex;gap:26px;align-items:center;}
  .lnav__links a{font-size:.9rem;color:var(--muted);font-weight:500;transition:color .15s;}
  .lnav__links a:hover{color:var(--ink);}
  @media(max-width:820px){.lnav__links{display:none;}}
  .hero{position:relative;padding:clamp(56px,8vw,96px) 0 clamp(40px,6vw,72px);text-align:center;overflow:hidden;}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(1000px 500px at 78% -8%,rgba(62,145,97,.10),transparent 60%),radial-gradient(720px 440px at 6% 8%,rgba(226,162,74,.09),transparent 62%);pointer-events:none;}
  .hero__in{position:relative;max-width:860px;margin:0 auto;padding:0 28px;}
  .eyebrow{font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.16em;text-transform:uppercase;color:var(--leaf-deep);display:inline-flex;align-items:center;gap:.6em;}
  .eyebrow::before{content:"";width:22px;height:1px;background:var(--leaf);}
  .hero h1{font-size:clamp(2.4rem,5.2vw,4.1rem);line-height:1.03;letter-spacing:-.022em;margin:.5em 0 .38em;}
  .hero h1 em{font-style:italic;color:var(--forest);}
  .hero .lead{font-size:clamp(1.05rem,1.7vw,1.22rem);color:var(--muted);max-width:640px;margin:0 auto;}
  .hero__cta{display:flex;gap:14px;justify-content:center;margin-top:32px;flex-wrap:wrap;}
  .hero__trust{margin-top:26px;font-family:var(--mono);font-size:.72rem;color:var(--faint);display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
  .hero__trust span{display:inline-flex;align-items:center;gap:.5em;}
  .tdot{width:5px;height:5px;border-radius:50%;background:var(--leaf);}
  .peek{max-width:1000px;margin:clamp(36px,5vw,60px) auto 0;padding:0 28px;}
  .peek__frame{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-lg);overflow:hidden;}
  .peek__bar{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);background:#FCFDFB;}
  .peek__dot{width:11px;height:11px;border-radius:50%;background:#E0E5DB;}
  .peek__dot:nth-child(1){background:#E7B4AE;}.peek__dot:nth-child(2){background:#EBD2A0;}.peek__dot:nth-child(3){background:#B7D6BE;}
  .peek__url{margin-left:12px;font-family:var(--mono);font-size:.72rem;color:var(--faint);background:#fff;border:1px solid var(--line);border-radius:100px;padding:.3em .9em;}
  .peek__img{display:block;width:100%;}
  .peek__live{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;background:var(--bg);}
  .peek__scale{position:absolute;top:0;left:0;width:1440px;transform-origin:top left;pointer-events:none;}
  .peek__scale .main{padding:20px 24px;}
  /* render the four modules cleanly in the preview */
  .peek__scale .side,.peek__scale .top,.peek__scale .ptabs,.peek__scale .crumb,.peek__scale .phead,.peek__scale .ck-strip,.peek__scale .kbfab{display:none !important;}
  .peek__scale .app{display:block;}
  .peek__scale .present-banner{display:flex !important;margin-bottom:12px;}
  .lsection{max-width:1180px;margin:0 auto;padding:clamp(56px,8vw,100px) 28px;}
  .lhead{max-width:700px;margin-bottom:clamp(32px,5vw,52px);}
  .lhead h2{font-size:clamp(1.8rem,3.6vw,2.7rem);line-height:1.08;margin:.4em 0;}
  .lhead p{color:var(--muted);font-size:1.05rem;margin:0;}
  .mods{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
  .mod{border:1px solid var(--line);border-radius:18px;padding:26px;background:var(--panel);box-shadow:var(--sh-sm);transition:transform .2s,box-shadow .2s;}
  .mod:hover{transform:translateY(-3px);box-shadow:var(--sh-md);}
  .mod__no{font-family:var(--mono);font-size:.72rem;color:var(--leaf-deep);letter-spacing:.1em;}
  .mod h3{font-size:1.32rem;margin:.5em 0 .4em;}
  .mod p{color:var(--muted);font-size:.95rem;margin:0 0 14px;}
  .tm{font-size:.62em;vertical-align:super;letter-spacing:0;font-weight:inherit}
  .mpill{font-family:var(--mono);font-size:.66rem;color:var(--forest);background:var(--leaf-soft);border-radius:6px;padding:.35em .6em;margin-right:6px;display:inline-block;}
  .lcta{background:var(--forest);color:#eef3ec;text-align:center;position:relative;overflow:hidden;}
  .lcta::after{content:"";position:absolute;inset:0;background:radial-gradient(800px 400px at 50% -20%,rgba(62,145,97,.35),transparent 60%);pointer-events:none;}
  .lcta__in{position:relative;max-width:1180px;margin:0 auto;padding:clamp(56px,8vw,96px) 28px;}
  .lcta h2{color:#fff;font-size:clamp(2rem,4vw,3rem);line-height:1.06;max-width:680px;margin:0 auto .4em;}
  .lcta p{color:#c1d1c3;max-width:500px;margin:0 auto 30px;font-size:1.06rem;}
  .btn-onlight{background:#fff;color:var(--forest);}
  .btn-onlight:hover{background:#f0f5ee;transform:translateY(-2px);}
  .lfoot{background:#102A1D;color:#8ea391;padding:40px 0;}
  .lfoot__in{max-width:1180px;margin:0 auto;padding:0 28px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font-size:.82rem;}
  .lfoot .brand{color:#eef3ec;}

  /* ================= APP SHELL ================= */
  #view-app{min-height:100vh;}
  .app{display:grid;grid-template-columns:236px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"side top" "side main";min-height:100vh;}
  .side{grid-area:side;background:var(--forest);color:#cdddd0;display:flex;flex-direction:column;padding:20px 14px;gap:5px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .side__brand{display:flex;align-items:center;gap:.55em;color:#fff;font-family:var(--sans);font-weight:700;font-size:1.12rem;padding:6px 10px 18px;letter-spacing:-.01em;background:none;border:0;}
  .side__brand svg{width:28px;height:28px;flex:0 0 auto;}
  .navlabel{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:#6f8574;padding:14px 12px 6px;}
  .navitem{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:11px;color:#b9cbbd;font-size:.9rem;font-weight:500;transition:background .15s,color .15s;background:none;border:0;width:100%;text-align:left;}
  .navitem svg{width:18px;height:18px;flex:0 0 auto;stroke-width:1.7;}
  .navitem:hover{background:rgba(255,255,255,.06);color:#fff;}
  .navitem.on{background:rgba(126,185,142,.16);color:#fff;font-weight:600;}
  .navitem .badge{margin-left:auto;background:var(--amber);color:#3a2708;font-size:.66rem;font-weight:700;border-radius:100px;padding:.05em .5em;font-family:var(--sans);}
  .side__spacer{flex:1;}
  .side__user{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.14);}
  .side__user .ava{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#7FB98E,#2E7449);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.82rem;font-family:var(--sans);flex:0 0 auto;}
  .side__user .who b{color:#fff;font-size:.85rem;font-weight:600;display:block;font-family:var(--sans);}
  .side__user .who small{color:#8ea391;font-size:.72rem;}
  .top{grid-area:top;background:rgba(244,246,242,.85);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 30px;height:66px;position:sticky;top:0;z-index:20;}
  .search{flex:1;max-width:440px;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:100px;padding:9px 15px;color:var(--faint);}
  .search svg{width:16px;height:16px;flex:0 0 auto;}
  .search input{border:0;outline:0;background:none;font-size:.88rem;width:100%;}
  .top__spacer{flex:1;}
  .iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted);position:relative;transition:border-color .15s;}
  .iconbtn:hover{border-color:var(--line-strong);}
  .iconbtn svg{width:18px;height:18px;stroke-width:1.8;}
  .iconbtn .rdot{position:absolute;top:9px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--rose);border:1.5px solid var(--panel);}
  .main{grid-area:main;padding:20px clamp(24px,3vw,44px);width:100%;max-width:100%;}

  /* (present mode removed) */
  .subview{display:none;}
  .subview.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* ===== cards ===== */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-sm);overflow:hidden;margin-bottom:22px;}
  .card__h{display:flex;align-items:center;gap:.6em;padding:17px 20px 0;flex-wrap:wrap;}
  .card__h h3{font-family:var(--sans);font-size:1.02rem;font-weight:700;letter-spacing:-.01em;}
  .card__h .tag{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf-deep);background:var(--leaf-soft);padding:.28em .6em;border-radius:6px;}
  .card__h .chipn{font-family:var(--mono);font-size:.68rem;color:var(--muted);background:#F1F4EE;border-radius:100px;padding:.15em .6em;}
  .card__h .hspace{margin-left:auto;}
  .card__h .link{font-size:.82rem;font-weight:600;color:var(--leaf-deep);display:inline-flex;align-items:center;gap:.3em;background:none;border:0;}
  .card__h .link svg{width:14px;height:14px;}
  .card__b{padding:14px 20px 20px;}

  /* greet + stats */
  .greet{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
  .greet h1{font-size:2rem;letter-spacing:-.01em;line-height:1.05;}
  .greet h1 span{color:var(--leaf-deep);}
  .greet p{color:var(--muted);font-size:.95rem;margin:.35em 0 0;font-family:var(--sans);}
  .greet .date{font-family:var(--mono);font-size:.74rem;color:var(--faint);text-align:right;white-space:nowrap;}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--sh-sm);position:relative;overflow:hidden;}
  .stat__ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;margin-bottom:14px;}
  .stat__ico svg{width:19px;height:19px;stroke-width:1.8;}
  .i-green{background:var(--leaf-soft);color:var(--leaf-deep);}.i-amber{background:var(--amber-soft);color:var(--amber-deep);}.i-blue{background:var(--blue-soft);color:var(--blue);}.i-rose{background:var(--rose-soft);color:var(--rose);}.i-violet{background:var(--violet-soft);color:var(--violet);}
  .stat b{font-size:1.9rem;line-height:1;display:block;}
  .stat small{color:var(--muted);font-size:.82rem;display:block;margin-top:5px;font-family:var(--sans);}
  .stat .trend{position:absolute;top:18px;right:18px;font-family:var(--mono);font-size:.7rem;padding:.15em .5em;border-radius:6px;}
  .trend.up{background:var(--leaf-soft);color:var(--leaf-deep);}.trend.flat{background:#EEF1EB;color:var(--faint);}
  .grid{display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start;}
  @media(max-width:1140px){.grid{grid-template-columns:1fr;}.stats{grid-template-columns:1fr 1fr;}}

  /* schedule rows */
  .sched{display:flex;flex-direction:column;}
  .appt{display:grid;grid-template-columns:66px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;font-family:var(--sans);cursor:pointer;}
  .appt:last-child{border-bottom:0;}
  .appt__time{font-family:var(--mono);font-size:.8rem;color:var(--ink);font-weight:500;line-height:1.2;}
  .appt__time small{display:block;color:var(--faint);font-size:.66rem;font-weight:400;}
  .appt__main{display:flex;align-items:center;gap:12px;min-width:0;}
  .appt__ava{width:38px;height:38px;border-radius:11px;color:#fff;font-weight:700;display:grid;place-items:center;font-size:.8rem;flex:0 0 auto;font-family:var(--sans);}
  .a1{background:linear-gradient(135deg,#7FB98E,#2E7449);}.a2{background:linear-gradient(135deg,#E9B168,#C4822B);}.a3{background:linear-gradient(135deg,#7FA8CE,#4E7FB0);}.a4{background:linear-gradient(135deg,#E39A92,#C15D53);}.a5{background:linear-gradient(135deg,#9C8FC4,#6E5DA3);}
  .appt__who{line-height:1.25;min-width:0;text-align:left;}
  .appt__who b{font-size:.92rem;font-weight:600;display:block;font-family:var(--sans);}
  .appt__who small{color:var(--muted);font-size:.76rem;}
  .tag2{font-family:var(--mono);font-size:.62rem;font-weight:500;padding:.22em .55em;border-radius:6px;white-space:nowrap;}
  .tag--new{background:var(--leaf-soft);color:var(--leaf-deep);}.tag--follow{background:var(--blue-soft);color:var(--blue);}.tag--review{background:var(--amber-soft);color:var(--amber-deep);}
  .appt__go{display:flex;align-items:center;gap:8px;}
  .ghostbtn{font-size:.78rem;font-weight:600;color:var(--muted);border:1px solid var(--line-strong);background:#fff;border-radius:100px;padding:.45em .9em;white-space:nowrap;transition:border-color .15s,color .15s;}
  .appt:hover .ghostbtn{border-color:var(--forest);color:var(--forest);}
  .appt.now{background:linear-gradient(90deg,var(--leaf-soft),transparent);margin:0 -20px;padding-left:20px;padding-right:20px;border-radius:12px;border-bottom-color:transparent;}
  .appt.now .livedot{width:7px;height:7px;border-radius:50%;background:var(--leaf);display:inline-block;margin-right:5px;animation:blink 1.6s ease infinite;}
  @keyframes blink{0%,100%{opacity:1;}50%{opacity:.35;}}

  .stack{display:flex;flex-direction:column;gap:22px;}
  .approval{border:1px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:12px;background:#FCFDFB;}
  .approval:last-child{margin-bottom:0;}
  .approval__top{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .approval__top .k{font-family:var(--mono);font-size:.63rem;letter-spacing:.06em;text-transform:uppercase;padding:.2em .5em;border-radius:6px;}
  .k--rec{background:var(--leaf-soft);color:var(--leaf-deep);}.k--flag{background:var(--amber-soft);color:var(--amber-deep);}.k--sum{background:var(--blue-soft);color:var(--blue);}
  .approval__top b{font-size:.85rem;font-weight:600;font-family:var(--sans);}
  .approval__top .who{margin-left:auto;font-size:.74rem;color:var(--faint);}
  .approval p{margin:0 0 10px;font-size:.82rem;color:var(--muted);line-height:1.45;font-family:var(--sans);}
  .approval p .flagword{color:var(--amber-deep);font-weight:600;}
  .approval__act{display:flex;gap:8px;}
  .mini{font-size:.78rem;font-weight:600;border-radius:100px;padding:.4em .9em;border:1px solid var(--line-strong);background:#fff;color:var(--ink);transition:all .14s;font-family:var(--sans);}
  .mini:hover{border-color:var(--forest);}
  .mini--go{background:var(--forest);border-color:var(--forest);color:#eef3ec;}
  .qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .qa button{display:flex;align-items:center;gap:10px;text-align:left;background:#FCFDFB;border:1px solid var(--line);border-radius:12px;padding:13px;transition:transform .15s,box-shadow .15s,border-color .15s;}
  .qa button:hover{transform:translateY(-2px);box-shadow:var(--sh-sm);border-color:var(--line-strong);}
  .qa__i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;}
  .qa__i svg{width:17px;height:17px;stroke-width:1.7;}
  .qa__t b{font-size:.83rem;font-weight:600;display:block;font-family:var(--sans);}
  .qa__t small{color:var(--muted);font-size:.72rem;}

  /* patients list */
  .ptop{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .ptop h1{font-size:2rem;line-height:1.05;}
  .ptop p{color:var(--muted);margin:.35em 0 0;font-family:var(--sans);font-size:.95rem;}
  .pfilters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .pfilter{font-family:var(--sans);font-size:.82rem;font-weight:600;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:100px;padding:.5em 1em;transition:all .14s;}
  .pfilter.on{background:var(--forest);border-color:var(--forest);color:#eef3ec;}
  .ptable{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-sm);overflow:hidden;}
  .prow{display:grid;grid-template-columns:1.4fr 1fr .8fr .9fr auto;gap:14px;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;font-family:var(--sans);cursor:pointer;transition:background .12s;}
  .prow:last-child{border-bottom:0;}
  .prow:hover{background:#FAFCF8;}
  .prow.head{background:#FCFDFB;cursor:default;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding-top:12px;padding-bottom:12px;}
  .prow.head:hover{background:#FCFDFB;}
  .pcell-name{display:flex;align-items:center;gap:12px;min-width:0;}
  .pcell-name .ava{width:36px;height:36px;border-radius:10px;color:#fff;font-weight:700;display:grid;place-items:center;font-size:.78rem;flex:0 0 auto;}
  .pcell-name b{font-size:.92rem;font-weight:600;display:block;}
  .pcell-name small{color:var(--muted);font-size:.75rem;}
  .pdx{font-size:.85rem;color:var(--ink);}
  .pstat{font-family:var(--mono);font-size:.72rem;font-weight:500;padding:.25em .6em;border-radius:6px;display:inline-block;}
  .ps-ok{background:var(--leaf-soft);color:var(--leaf-deep);}.ps-flag{background:var(--amber-soft);color:var(--amber-deep);}.ps-new{background:var(--blue-soft);color:var(--blue);}
  .plast{font-size:.83rem;color:var(--muted);font-family:var(--mono);}
  .prow .chev{color:var(--faint);}
  .prow .chev svg{width:18px;height:18px;}
  @media(max-width:820px){ .prow{grid-template-columns:1.4fr auto;} .prow .pcell-dx,.prow .pcell-stat,.prow .pcell-last{display:none;} .prow.head{display:none;} }

  /* patient detail */
  .crumb{display:flex;align-items:center;gap:9px;font-size:.85rem;color:var(--muted);margin-bottom:18px;font-family:var(--sans);}
  .crumb button{color:var(--leaf-deep);font-weight:600;display:inline-flex;align-items:center;gap:.4em;background:none;border:0;font-family:var(--sans);font-size:.85rem;}
  .crumb button svg{width:15px;height:15px;}
  .crumb .sep{color:var(--line-strong);}
  .crumb b{color:var(--ink);font-weight:600;}
  .phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:12px;flex-wrap:wrap;}
  .phead__ava{width:66px;height:66px;border-radius:18px;background:linear-gradient(135deg,#7FB98E,#2E7449);color:#fff;font-weight:700;display:grid;place-items:center;font-size:1.5rem;flex:0 0 auto;box-shadow:var(--sh-sm);font-family:var(--sans);}
  .phead__id{min-width:0;flex:1;}
  .phead__id h1{font-size:1.85rem;letter-spacing:-.01em;line-height:1.05;}
  .phead__meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .chip{font-family:var(--mono);font-size:.68rem;padding:.28em .6em;border-radius:7px;background:#F1F4EE;color:var(--muted);}
  .chip--dx{background:var(--rose-soft);color:#b3554b;}.chip--dx2{background:var(--amber-soft);color:var(--amber-deep);}
  .phead__act{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

  /* tabs */
  .ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;}
  .ptab{font-family:var(--sans);font-size:.9rem;font-weight:600;color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:.7em 1em;white-space:nowrap;transition:color .15s,border-color .15s;margin-bottom:-1px;}
  .ptab:hover{color:var(--ink);}
  .ptab.on{color:var(--forest);border-bottom-color:var(--leaf);}
  .ptabpane{display:none;}
  .ptabpane.on{display:block;animation:fade .2s ease;}

  .layout{display:grid;grid-template-columns:1fr 320px;gap:22px;align-items:start;}
  @media(max-width:1080px){.layout{grid-template-columns:1fr;}}

  /* meal assess */
  .meal{display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
  .plate{position:relative;width:150px;height:150px;flex:0 0 auto;}
  .scan{position:absolute;left:6%;right:6%;height:2px;background:linear-gradient(90deg,transparent,var(--leaf),transparent);top:8%;border-radius:2px;opacity:0;box-shadow:0 0 12px 2px rgba(62,145,97,.5);}
  .macros{flex:1;min-width:210px;}
  .macro{margin-bottom:11px;}.macro:last-child{margin-bottom:0;}
  .macro__top{display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;color:var(--muted);margin-bottom:4px;font-family:var(--sans);}
  .macro__top b{font-family:var(--mono);color:var(--ink);font-size:.92rem;font-weight:600;}
  .bar{height:7px;border-radius:100px;background:#EEF1EB;overflow:hidden;}
  .bar>i{display:block;height:100%;border-radius:100px;transition:width 1s cubic-bezier(.3,.9,.3,1);}
  .assess-foot{display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap;font-family:var(--sans);}
  .assess-foot small{color:var(--faint);font-size:.76rem;margin-right:auto;}
  .foodrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:.85rem;}
  .foodrow:last-child{border-bottom:0;}
  .foodrow .fname{flex:1;font-weight:600;}
  .foodrow .fkcal{font-family:var(--mono);color:var(--muted);font-size:.8rem;}
  .foodrow input{width:130px;border:1px solid var(--line-strong);border-radius:8px;padding:.4em .6em;}
  .foodrow .del{color:var(--rose);background:none;border:0;font-size:1.1rem;line-height:1;padding:0 .3em;}

  /* care plan traceable */
  .planline{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;background:#FCFDFB;position:relative;}
  .planline:last-child{margin-bottom:0;}
  .planline.flagged{border-color:#F0D9A8;background:linear-gradient(90deg,#FDF7EA,#FCFDFB);}
  .planline__i{width:30px;height:30px;border-radius:9px;background:var(--leaf-soft);color:var(--leaf-deep);display:grid;place-items:center;flex:0 0 auto;margin-top:1px;}
  .planline__i svg{width:16px;height:16px;stroke-width:1.9;}
  .planline.flagged .planline__i{background:var(--amber-soft);color:var(--amber-deep);}
  .planline__b{flex:1;min-width:0;}
  .planline__txt{font-size:.9rem;line-height:1.5;color:var(--ink);font-family:var(--sans);}
  .planline__txt b{font-weight:600;}
  .planline__meta{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .srcbtn{font-family:var(--mono);font-size:.64rem;color:var(--forest);border:1px solid var(--line-strong);border-radius:6px;padding:.28em .55em;display:inline-flex;gap:.35em;align-items:center;background:#fff;transition:all .14s;cursor:pointer;}
  .srcbtn:hover{background:var(--leaf-soft);border-color:var(--leaf);}
  .srcbtn::before{content:"↗";color:var(--leaf-deep);font-size:.72em;}
  .planline__act{display:flex;gap:6px;flex:0 0 auto;}
  .lact{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted);transition:all .14s;}
  .lact:hover{border-color:var(--forest);color:var(--forest);}
  .lact svg{width:14px;height:14px;stroke-width:1.9;}
  .flagnote{font-size:.76rem;color:var(--amber-deep);margin-top:6px;font-family:var(--sans);display:flex;align-items:center;gap:.4em;font-weight:500;}
  .flagnote svg{width:14px;height:14px;flex:0 0 auto;stroke-width:2;}
  .plan-add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}

  /* agents */
  .agentflow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:640px){.agentflow{grid-template-columns:1fr 1fr;}}
  .agent{border:1px solid var(--line);border-radius:11px;padding:11px 12px;background:#FCFDFB;opacity:.5;transition:opacity .4s,border-color .4s,box-shadow .4s;}
  .agent.live{opacity:1;border-color:#CFE3D2;box-shadow:0 4px 12px rgba(46,116,73,.07);}
  .agent.flagged.live{border-color:#F0D9A8;box-shadow:0 4px 12px rgba(196,130,43,.1);}
  .agent__n{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);}
  .agent__t{font-size:.82rem;font-weight:600;margin:3px 0 5px;font-family:var(--sans);}
  .agent__s{font-size:.72rem;color:var(--muted);font-family:var(--sans);}
  .agent__s .ok{color:var(--leaf-deep);font-weight:700;}.agent__s .warn{color:var(--amber-deep);font-weight:700;}
  .approve{display:flex;align-items:center;gap:12px;margin-top:16px;padding-top:15px;border-top:1px dashed var(--line-strong);flex-wrap:wrap;}
  .approve__txt{font-size:.82rem;color:var(--muted);margin-right:auto;font-family:var(--sans);}
  .approve__txt b{color:var(--ink);font-weight:600;}
  .approved-stamp{display:none;align-items:center;gap:.5em;font-size:.82rem;color:var(--leaf-deep);font-weight:600;font-family:var(--sans);background:var(--leaf-soft);border-radius:100px;padding:.5em 1em;}
  .approved-stamp svg{width:15px;height:15px;stroke-width:2.4;}

  /* side cards */
  .side-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-sm);padding:18px 18px 20px;margin-bottom:22px;}
  .side-card h4{font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
  .side-card h4 .edt{color:var(--leaf-deep);cursor:pointer;font-family:var(--sans);letter-spacing:0;text-transform:none;font-size:.72rem;font-weight:600;}
  .vital{display:flex;align-items:baseline;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);}
  .vital:last-child{border-bottom:0;}
  .vital span{font-size:.82rem;color:var(--muted);font-family:var(--sans);}
  .vital b{font-family:var(--mono);font-size:.92rem;font-weight:600;}
  .vital b.good{color:var(--leaf-deep);}.vital b.watch{color:var(--amber-deep);}.vital b.bad{color:var(--rose);}
  .sparklab{display:flex;justify-content:space-between;align-items:baseline;font-size:.78rem;color:var(--muted);margin-bottom:6px;font-family:var(--sans);}
  .sparklab b{font-size:1.15rem;color:var(--ink);}
  .trend-badge{font-family:var(--mono);font-size:.66rem;color:var(--leaf-deep);background:var(--leaf-soft);border-radius:6px;padding:.15em .5em;}
  .goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:11px;}
  .goals li{display:flex;gap:10px;align-items:flex-start;font-size:.82rem;color:var(--ink);line-height:1.4;font-family:var(--sans);}
  .goals .tick{width:17px;height:17px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;font-size:.66rem;margin-top:1px;}
  .tick.done{background:var(--leaf-soft);color:var(--leaf-deep);}.tick.open{background:var(--amber-soft);color:var(--amber-deep);}
  .goals li small{color:var(--muted);display:block;font-size:.74rem;}

  /* timeline of consults */
  .consult-list{display:flex;flex-direction:column;gap:0;}
  .consult{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s;}
  .consult:last-child{border-bottom:0;}
  .consult:hover{background:#FAFCF8;}
  .consult__date{text-align:center;flex:0 0 auto;min-width:56px;}
  .consult__date b{font-family:var(--serif);font-size:1.4rem;color:var(--forest);display:block;line-height:1;}
  .consult__date small{font-family:var(--mono);font-size:.66rem;color:var(--faint);text-transform:uppercase;}
  .consult__b b{font-size:.95rem;font-weight:600;font-family:var(--sans);display:block;}
  .consult__b p{margin:4px 0 0;font-size:.83rem;color:var(--muted);font-family:var(--sans);line-height:1.45;}
  .consult__tags{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .ct{font-family:var(--mono);font-size:.62rem;padding:.2em .5em;border-radius:5px;background:#F1F4EE;color:var(--muted);}
  .consult__status{font-family:var(--mono);font-size:.7rem;font-weight:500;padding:.25em .6em;border-radius:6px;white-space:nowrap;flex:0 0 auto;}

  /* actionable plan for patient */
  .actionbox{border:1px solid var(--line);border-radius:14px;padding:18px;background:linear-gradient(180deg,#FCFDFB,#fff);}
  .action{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);}
  .action:last-child{border-bottom:0;}
  .action__check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);flex:0 0 auto;margin-top:1px;cursor:pointer;display:grid;place-items:center;transition:all .15s;background:#fff;}
  .action__check.on{background:var(--leaf);border-color:var(--leaf);}
  .action__check svg{width:13px;height:13px;stroke:#fff;stroke-width:3;opacity:0;transition:opacity .15s;}
  .action__check.on svg{opacity:1;}
  .action__b{flex:1;min-width:0;}
  .action__b b{font-size:.9rem;font-weight:600;font-family:var(--sans);display:block;}
  .action__b.done b{text-decoration:line-through;color:var(--faint);}
  .action__b small{color:var(--muted);font-size:.78rem;font-family:var(--sans);}
  .action__cat{font-family:var(--mono);font-size:.6rem;color:var(--leaf-deep);background:var(--leaf-soft);border-radius:5px;padding:.2em .5em;margin-top:5px;display:inline-block;}

  /* invoices */
  .inv-table{width:100%;border-collapse:collapse;font-family:var(--sans);}
  .inv-table th{text-align:left;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 12px;border-bottom:1px solid var(--line);font-weight:500;}
  .inv-table td{padding:12px;border-bottom:1px solid var(--line);font-size:.87rem;}
  .inv-table tr:last-child td{border-bottom:0;}
  .inv-num{font-family:var(--mono);font-size:.82rem;color:var(--muted);}
  .inv-amt{font-family:var(--mono);font-weight:600;text-align:right;}
  .inv-status{font-family:var(--mono);font-size:.7rem;font-weight:500;padding:.25em .6em;border-radius:6px;}
  .is-paid{background:var(--leaf-soft);color:var(--leaf-deep);}.is-open{background:var(--amber-soft);color:var(--amber-deep);}.is-draft{background:#EEF1EB;color:var(--faint);}

  /* notes */
  .notebox{border:1px solid var(--line);border-radius:12px;padding:16px;background:#FCFDFB;margin-bottom:14px;}
  .notebox textarea{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:12px;min-height:90px;resize:vertical;line-height:1.5;font-size:.88rem;outline:0;}
  .notebox textarea:focus{border-color:var(--leaf);}

  /* knowledge page */
  .kbtop{margin-bottom:22px;}
  .kbtop h1{font-size:2rem;line-height:1.05;}
  .kbtop p{color:var(--muted);margin:.35em 0 0;font-family:var(--sans);font-size:.95rem;}
  .kbsearch{display:flex;align-items:center;gap:11px;background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;padding:14px 18px;box-shadow:var(--sh-sm);margin:18px 0 10px;}
  .kbsearch svg{width:20px;height:20px;color:var(--leaf-deep);flex:0 0 auto;stroke-width:1.9;}
  .kbsearch input{border:0;outline:0;background:none;font-size:1rem;width:100%;}
  .kbchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:26px;}
  .kbchip{font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--muted);border:1px solid var(--line);background:#fff;border-radius:100px;padding:.45em .9em;transition:all .14s;}
  .kbchip:hover{border-color:var(--leaf);color:var(--forest);}
  .kbcols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  @media(max-width:980px){.kbcols{grid-template-columns:1fr 1fr;}}
  @media(max-width:640px){.kbcols{grid-template-columns:1fr;}}
  .kbsource{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-sm);padding:20px;}
  .kbsource__h{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .kbsource__ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;}
  .kbsource__ico svg{width:20px;height:20px;stroke-width:1.7;}
  .kbsource__h b{font-family:var(--sans);font-size:.98rem;font-weight:700;display:block;}
  .kbsource__h small{color:var(--faint);font-size:.72rem;font-family:var(--mono);}
  .kbitem{padding:11px 0;border-bottom:1px solid var(--line);}
  .kbitem:last-child{border-bottom:0;padding-bottom:0;}
  .kbitem b{font-size:.86rem;font-weight:600;font-family:var(--sans);display:block;}
  .kbitem small{color:var(--muted);font-size:.77rem;font-family:var(--sans);}
  .kbtagsrc{font-family:var(--mono);font-size:.63rem;color:var(--forest);border:1px solid var(--line-strong);border-radius:5px;padding:.12em .45em;margin-top:6px;display:inline-block;}

  /* knowledge hover panel */
  .kbfab{position:fixed;right:24px;bottom:24px;z-index:70;display:flex;align-items:center;gap:.55em;background:var(--forest);color:#eef3ec;border:0;border-radius:100px;padding:.85em 1.2em;font-family:var(--sans);font-weight:600;font-size:.9rem;box-shadow:var(--sh-lg);transition:transform .18s,box-shadow .18s,background .18s;}
  .kbfab:hover{background:var(--forest-2);transform:translateY(-2px);}
  .kbfab svg{width:19px;height:19px;stroke-width:1.9;}
  .kbfab .pip{width:7px;height:7px;border-radius:50%;background:var(--leaf);}
  .kbpanel{position:fixed;right:24px;bottom:88px;z-index:71;width:380px;max-width:calc(100vw - 40px);max-height:min(560px,calc(100vh - 130px));background:var(--panel);border:1px solid var(--line-strong);border-radius:18px;box-shadow:var(--sh-lg);display:flex;flex-direction:column;overflow:hidden;opacity:0;transform:translateY(12px) scale(.98);pointer-events:none;transition:opacity .2s ease,transform .2s ease;transform-origin:bottom right;}
  .kbpanel.open{opacity:1;transform:none;pointer-events:auto;}
  .kbpanel__h{display:flex;align-items:center;gap:.6em;padding:15px 16px;border-bottom:1px solid var(--line);background:#FCFDFB;}
  .kbpanel__h .dotlogo{width:30px;height:30px;border-radius:9px;background:var(--forest);display:grid;place-items:center;flex:0 0 auto;}
  .kbpanel__h .dotlogo svg{width:18px;height:18px;}
  .kbpanel__h b{font-family:var(--sans);font-size:.92rem;font-weight:700;}
  .kbpanel__h small{display:block;color:var(--faint);font-size:.7rem;font-family:var(--mono);}
  .kbpanel__close{margin-left:auto;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted);}
  .kbpanel__close svg{width:15px;height:15px;stroke-width:2;}
  .kbchat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .msg{max-width:88%;font-size:.85rem;line-height:1.5;font-family:var(--sans);}
  .msg.user{align-self:flex-end;background:var(--forest);color:#eef3ec;border-radius:14px 14px 4px 14px;padding:9px 13px;}
  .msg.bot{align-self:flex-start;background:#F2F5EF;color:var(--ink);border-radius:14px 14px 14px 4px;padding:11px 13px;}
  .msg.bot .src{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px;}
  .msg.bot .src a{font-family:var(--mono);font-size:.62rem;color:var(--forest);border:1px solid var(--line-strong);border-radius:5px;padding:.15em .45em;background:#fff;display:inline-flex;gap:.35em;align-items:center;cursor:pointer;}
  .msg.bot .src a::before{content:"↗";color:var(--leaf-deep);font-size:.7em;}
  .kbtyping{align-self:flex-start;display:flex;gap:4px;padding:11px 14px;background:#F2F5EF;border-radius:14px;}
  .kbtyping i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bob 1s infinite;}
  .kbtyping i:nth-child(2){animation-delay:.15s;}.kbtyping i:nth-child(3){animation-delay:.3s;}
  @keyframes bob{0%,100%{opacity:.3;transform:translateY(0);}50%{opacity:1;transform:translateY(-3px);}}
  .kbsug{padding:0 16px 10px;display:flex;gap:6px;flex-wrap:wrap;}
  .kbsug button{font-family:var(--sans);font-size:.74rem;font-weight:600;color:var(--leaf-deep);background:var(--leaf-soft);border:0;border-radius:100px;padding:.4em .8em;transition:background .14s;}
  .kbsug button:hover{background:#DAE9DB;}
  .kbform{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);background:#FCFDFB;}
  .kbform input{flex:1;border:1px solid var(--line-strong);border-radius:100px;padding:.6em 1em;font-size:.85rem;outline:0;}
  .kbform input:focus{border-color:var(--leaf);}
  .kbform button{width:38px;height:38px;border-radius:50%;background:var(--amber);border:0;display:grid;place-items:center;flex:0 0 auto;color:#3a2708;}
  .kbform button svg{width:17px;height:17px;stroke-width:2.2;}

  /* ===== MODAL ===== */
  .modal-back{position:fixed;inset:0;background:rgba(16,42,29,.5);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .2s ease;}
  .modal-back.open{opacity:1;pointer-events:auto;}
  .modal{background:var(--panel);border-radius:20px;box-shadow:var(--sh-lg);width:100%;max-width:520px;max-height:calc(100vh - 48px);overflow-y:auto;transform:translateY(14px) scale(.98);transition:transform .22s cubic-bezier(.2,.8,.2,1);}
  .modal-back.open .modal{transform:none;}
  .modal__h{display:flex;align-items:center;gap:.6em;padding:20px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2;}
  .modal__h h3{font-family:var(--sans);font-size:1.1rem;font-weight:700;}
  .modal__h .tag{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--leaf-deep);background:var(--leaf-soft);padding:.28em .6em;border-radius:6px;}
  .modal__close{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--muted);}
  .modal__close svg{width:16px;height:16px;stroke-width:2;}
  .modal__b{padding:22px;}
  .modal__foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--panel);}
  .field{margin-bottom:16px;}
  .field:last-child{margin-bottom:0;}
  .field label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:6px;font-family:var(--sans);}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:.7em .9em;outline:0;background:#fff;}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--leaf);}
  .field textarea{min-height:80px;resize:vertical;line-height:1.5;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .src-detail{font-size:.88rem;line-height:1.6;color:var(--ink);font-family:var(--sans);}
  .src-detail .quote{background:var(--leaf-soft);border-left:3px solid var(--leaf);border-radius:0 8px 8px 0;padding:12px 14px;margin:12px 0;font-style:italic;color:var(--forest);}
  .src-detail .meta-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
  .src-detail .meta-row .m{font-family:var(--mono);font-size:.66rem;background:#F1F4EE;color:var(--muted);border-radius:6px;padding:.3em .6em;}

  /* invoice detail print-ish */
  .invoice-doc{border:1px solid var(--line);border-radius:14px;padding:26px;background:#fff;}
  .invoice-doc__top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--line);}
  .invoice-doc__top .brand{font-family:var(--sans);}
  .invoice-doc__top h2{font-size:1.5rem;}
  .invoice-doc__meta{text-align:right;font-family:var(--mono);font-size:.78rem;color:var(--muted);line-height:1.7;}
  .invoice-doc table{width:100%;border-collapse:collapse;margin-bottom:18px;}
  .invoice-doc th{text-align:left;font-family:var(--mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:8px 0;border-bottom:1px solid var(--line);}
  .invoice-doc td{padding:11px 0;border-bottom:1px solid var(--line);font-size:.88rem;font-family:var(--sans);}
  .invoice-doc .r{text-align:right;font-family:var(--mono);}
  .invoice-doc__totals{margin-left:auto;width:260px;}
  .invoice-doc__totals .tl-row{display:flex;justify-content:space-between;padding:7px 0;font-size:.88rem;font-family:var(--sans);}
  .invoice-doc__totals .tl-row.grand{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;font-weight:700;font-size:1.05rem;}
  .invoice-doc__totals .r{font-family:var(--mono);}

  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--forest);color:#eef3ec;padding:13px 20px;border-radius:100px;font-size:.88rem;font-weight:600;font-family:var(--sans);box-shadow:var(--sh-md);display:flex;align-items:center;gap:.6em;opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:95;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast svg{width:17px;height:17px;stroke-width:2.4;color:#9ed2ac;}

  .empty{text-align:center;padding:40px 20px;color:var(--faint);font-family:var(--sans);}
  .empty svg{width:40px;height:40px;margin:0 auto 12px;stroke-width:1.4;color:var(--line-strong);}

  /* ===== COCKPIT (composed one-screen layout) ===== */
  .ck-strip{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:11px;margin-bottom:12px;flex-wrap:wrap;box-shadow:var(--sh-sm);}
  .ck-strip .ck-visit{font-family:var(--sans);font-weight:700;font-size:.95rem;display:flex;align-items:center;gap:.5em;}
  .ck-strip .ck-visit .n{width:26px;height:26px;border-radius:8px;background:var(--forest);color:#fff;display:grid;place-items:center;font-size:.78rem;font-family:var(--sans);}
  .ck-strip .ck-metrics{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap;}
  .ck-metric{text-align:left;}
  .ck-metric .lab{font-family:var(--mono);font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);}
  .ck-metric .val{font-family:var(--mono);font-size:.9rem;font-weight:600;color:var(--ink);}
  .ck-metric .val.good{color:var(--leaf-deep);}.ck-metric .val.watch{color:var(--amber-deep);}
  .ck-metric .val .arrow{font-size:.72em;}

  .ck-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;align-items:start;}
  @media(max-width:1080px){.ck-grid{grid-template-columns:1fr;}}
  .ck-col{display:flex;flex-direction:column;gap:16px;}

  /* hero care-plan card */
  .ck-hero{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--sh-md);overflow:hidden;}
  .ck-hero__h{display:flex;align-items:center;gap:.6em;padding:16px 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#FCFDFB,#fff);}
  .ck-hero__h .tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:#fff;background:var(--forest);padding:.3em .6em;border-radius:6px;}
  .ck-hero__h h3{font-family:var(--sans);font-size:1.05rem;font-weight:700;}
  .ck-hero__h .sub{font-family:var(--sans);font-size:.78rem;color:var(--faint);font-weight:400;}
  .ck-hero__b{padding:16px 18px;}

  /* quiet supporting tile */
  .ck-tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-sm);overflow:hidden;}
  .ck-tile__h{display:flex;align-items:center;gap:.55em;padding:13px 16px 0;}
  .ck-tile__h .ico{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;}
  .ck-tile__h .ico svg{width:15px;height:15px;stroke-width:1.8;}
  .ck-tile__h h4{font-family:var(--sans);font-size:.9rem;font-weight:700;letter-spacing:-.01em;}
  .ck-tile__h .more{margin-left:auto;color:var(--faint);background:none;border:0;font-size:.75rem;font-family:var(--sans);font-weight:600;display:inline-flex;align-items:center;gap:.3em;}
  .ck-tile__h .more:hover{color:var(--leaf-deep);}
  .ck-tile__h .more svg{width:13px;height:13px;}
  .ck-tile__b{padding:12px 16px 16px;}

  /* compact assessment inside tile */
  .ck-assess{display:flex;gap:14px;align-items:center;}
  .ck-assess .plate{width:96px;height:96px;flex:0 0 auto;}
  .ck-macro-mini{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;}
  .ck-mm{display:flex;align-items:center;gap:8px;font-family:var(--sans);font-size:.78rem;color:var(--muted);}
  .ck-mm .k{width:64px;}
  .ck-mm .track{flex:1;height:5px;border-radius:100px;background:#EEF1EB;overflow:hidden;}
  .ck-mm .track i{display:block;height:100%;border-radius:100px;}
  .ck-mm .v{font-family:var(--mono);font-size:.76rem;color:var(--ink);font-weight:600;width:52px;text-align:right;}
  .ck-chips{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;}
  .ck-chip{font-family:var(--mono);font-size:.62rem;color:var(--muted);background:#F1F4EE;border-radius:5px;padding:.25em .5em;}

  /* action mini */
  .ck-action{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);}
  .ck-action .action__check{margin-top:1px;}
  .ck-action:last-child{border-bottom:0;}
  .ck-action__b{flex:1;min-width:0;font-family:var(--sans);font-size:.82rem;}
  .ck-action__b.done{color:var(--faint);text-decoration:line-through;}
  .ck-progress{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .ck-progress .track{flex:1;height:6px;border-radius:100px;background:#EEF1EB;overflow:hidden;}
  .ck-progress .track i{display:block;height:100%;background:var(--leaf);border-radius:100px;}
  .ck-progress .lbl{font-family:var(--mono);font-size:.74rem;color:var(--muted);}

  /* mini vitals list */
  .ck-vits{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
  .ck-vit{display:flex;align-items:baseline;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);}
  .ck-vit span{font-size:.8rem;color:var(--muted);font-family:var(--sans);}
  .ck-vit b{font-family:var(--mono);font-size:.85rem;font-weight:600;}
  .ck-vit b.good{color:var(--leaf-deep);}.ck-vit b.watch{color:var(--amber-deep);}.ck-vit b.bad{color:var(--rose);}

  /* ===== FOUR-MODULE COCKPIT (proposal screenshot) ===== */
  .m4{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:stretch;}
  @media(max-width:1000px){.m4{grid-template-columns:1fr;}}
  .m4card{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh-sm);overflow:hidden;display:flex;flex-direction:column;}
  .m4card__h{display:flex;align-items:flex-start;gap:11px;padding:15px 17px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#FCFDFB,#fff);}
  .m4card__n{width:30px;height:30px;border-radius:9px;background:var(--forest);color:#fff;display:grid;place-items:center;flex:0 0 auto;font-family:var(--serif);font-weight:600;font-size:1rem;}
  .m4card__t{flex:1;min-width:0;}
  .m4card__t b{font-family:var(--sans);font-weight:700;font-size:.98rem;display:block;letter-spacing:-.01em;}
  .m4card__t small{font-family:var(--sans);font-size:.75rem;color:var(--faint);display:block;margin-top:1px;line-height:1.35;}
  .m4card__more{color:var(--leaf-deep);background:none;border:0;font-size:.74rem;font-weight:600;font-family:var(--sans);display:inline-flex;align-items:center;gap:.3em;white-space:nowrap;flex:0 0 auto;margin-top:3px;}
  .m4card__more svg{width:13px;height:13px;}
  .m4card__b{padding:15px 17px;flex:1;}

  /* module 1: assessment */
  .m4-assess{display:flex;gap:14px;align-items:center;}
  .m4-assess .plate{width:104px;height:104px;flex:0 0 auto;position:relative;}
  .m4-foods{flex:1;min-width:0;}
  .m4-food{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:.8rem;}
  .m4-food:last-child{border-bottom:0;}
  .m4-food .nm{flex:1;font-weight:600;}
  .m4-food .pt{font-family:var(--mono);font-size:.72rem;color:var(--muted);}
  .m4-food .kc{font-family:var(--mono);font-size:.72rem;color:var(--faint);width:52px;text-align:right;}
  .m4-modbadge{display:inline-flex;align-items:center;gap:.4em;font-family:var(--sans);font-size:.72rem;font-weight:600;color:var(--leaf-deep);background:var(--leaf-soft);border-radius:100px;padding:.3em .7em;margin-top:10px;}
  .m4-modbadge svg{width:12px;height:12px;stroke-width:2.4;}
  .m4-tot{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap;}
  .m4-tot span{font-family:var(--mono);font-size:.68rem;color:var(--muted);background:#F1F4EE;border-radius:5px;padding:.25em .55em;}

  /* module 2: knowledge grounding */
  .m4-grounded{display:flex;flex-direction:column;gap:9px;}
  .m4-gsource{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#FCFDFB;cursor:pointer;transition:border-color .14s,background .14s;}
  .m4-gsource:hover{border-color:var(--leaf);background:var(--leaf-soft);}
  .m4-gsource__i{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;}
  .m4-gsource__i svg{width:15px;height:15px;stroke-width:1.7;}
  .m4-gsource__b{flex:1;min-width:0;}
  .m4-gsource__b b{font-family:var(--sans);font-size:.82rem;font-weight:700;display:block;}
  .m4-gsource__b small{font-family:var(--sans);font-size:.72rem;color:var(--muted);}
  .m4-gsource__go{font-family:var(--mono);font-size:.6rem;color:var(--forest);border:1px solid var(--line-strong);border-radius:5px;padding:.2em .45em;flex:0 0 auto;}

  /* module 3: recs + meal plan */
  .m4-recs{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:7px;}
  .m4-recs li{display:flex;gap:8px;align-items:flex-start;font-family:var(--sans);font-size:.8rem;line-height:1.4;color:var(--ink);}
  .m4-recs li .tick{width:15px;height:15px;flex:0 0 auto;border-radius:50%;background:var(--leaf-soft);color:var(--leaf-deep);display:grid;place-items:center;font-size:.6rem;margin-top:1px;}
  .m4-recs li .src{font-family:var(--mono);font-size:.58rem;color:var(--forest);border:1px solid var(--line-strong);border-radius:4px;padding:.05em .3em;margin-left:4px;white-space:nowrap;}
  .m4-mealplan{border:1px solid var(--line);border-radius:11px;overflow:hidden;}
  .m4-mp__h{display:flex;align-items:center;gap:.5em;padding:9px 12px;background:var(--leaf-soft);border-bottom:1px solid #D6E6D8;}
  .m4-mp__h b{font-family:var(--sans);font-size:.78rem;font-weight:700;color:var(--forest);}
  .m4-mp__h small{font-family:var(--sans);font-size:.68rem;color:var(--leaf-deep);margin-left:auto;}
  .m4-mp__grid{display:grid;grid-template-columns:34px 1fr 1fr 1fr;}
  .m4-mp__row{display:contents;}
  .m4-mp__cell{padding:6px 8px;border-bottom:1px solid var(--line);font-family:var(--sans);font-size:.7rem;line-height:1.3;}
  .m4-mp__cell.day{font-family:var(--mono);font-size:.64rem;color:var(--faint);font-weight:600;display:flex;align-items:center;}
  .m4-mp__head .m4-mp__cell{background:#FCFDFB;font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line-strong);}
  .m4-mp__grid .m4-mp__row:last-child .m4-mp__cell{border-bottom:0;}

  /* module 4: longitudinal timeline */
  .m4-time{position:relative;}
  .m4-tl{list-style:none;margin:0;padding:0;position:relative;}
  .m4-tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1.5px;background:var(--line-strong);}
  .m4-tl li{position:relative;padding:0 0 12px 26px;}
  .m4-tl li:last-child{padding-bottom:0;}
  .m4-tl__dot{position:absolute;left:1px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;border:2.5px solid var(--leaf);display:grid;place-items:center;}
  .m4-tl li:last-child .m4-tl__dot{background:var(--leaf);box-shadow:0 0 0 3px var(--leaf-soft);}
  .m4-tl__d{font-family:var(--mono);font-size:.62rem;color:var(--faint);display:flex;align-items:center;gap:8px;}
  .m4-tl__d .vn{font-weight:600;color:var(--forest);}
  .m4-tl__d .st{margin-left:auto;font-size:.58rem;padding:.1em .4em;border-radius:4px;}
  .m4-tl__labs{display:flex;gap:8px;margin:3px 0 2px;flex-wrap:wrap;}
  .m4-tl__lab{font-family:var(--mono);font-size:.64rem;color:var(--ink);}
  .m4-tl__lab b{color:var(--leaf-deep);}
  .m4-tl__txt{font-family:var(--sans);font-size:.74rem;color:var(--muted);line-height:1.4;}
  .m4-outcomes{display:flex;gap:10px;margin-bottom:14px;padding:11px;background:linear-gradient(90deg,var(--leaf-soft),#F3FAF4);border:1px solid #D6E6D8;border-radius:11px;flex-wrap:wrap;}
  .m4-oc{flex:1;min-width:70px;}
  .m4-oc .lab{font-family:var(--mono);font-size:.58rem;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf-deep);}
  .m4-oc .val{font-family:var(--serif);font-size:1.15rem;color:var(--forest);line-height:1.1;}
  .m4-oc .val small{font-size:.6rem;color:var(--muted);font-family:var(--mono);}

  /* monitoring charts in module 4 */
  .m4-charts{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:520px){.m4-charts{grid-template-columns:1fr;}}
  .m4-chart{border:1px solid var(--line);border-radius:11px;padding:10px 11px 4px;background:#FCFDFB;}
  .m4-chart__h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;}
  .m4-chart__h b{font-family:var(--sans);font-size:.78rem;font-weight:700;}
  .m4-chart__h .now{font-family:var(--mono);font-size:.74rem;font-weight:600;}
  .m4-chart__h .now.good{color:var(--leaf-deep);}.m4-chart__h .now.watch{color:var(--amber-deep);}
  .m4-chart__sub{font-family:var(--mono);font-size:.58rem;color:var(--faint);margin-bottom:2px;display:flex;align-items:center;gap:.4em;}
  .m4-chart__sub .band{width:10px;height:8px;border-radius:2px;background:rgba(62,145,97,.18);display:inline-block;}
  .m4-chart.wide{grid-column:1 / -1;}

  /* ===== DENSE ALL-FEATURES COCKPIT ===== */
  .dash{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:stretch;}
  .dash>.dcard{grid-column:span 2;}          /* assessment: 1/3 */
  .dcard.charts{grid-column:span 6;}         /* overview: full width (row 1) */
  .dcard.rc{grid-column:span 4;}             /* care plan & actions: 2/3 (fills row with assessment) */
  .dcard.know{grid-column:span 6;}           /* knowledge: full width (last row) */
  @media(max-width:1100px){.dash{grid-template-columns:repeat(2,1fr);}.dash>.dcard,.dcard.charts,.dcard.rc,.dcard.know{grid-column:span 2;}}
  @media(max-width:680px){.dash{grid-template-columns:1fr;}.dash>.dcard,.dcard.charts,.dcard.rc,.dcard.know{grid-column:span 1;}}
  .dcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh-sm);overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .18s,transform .18s;}
  .dcard:hover{box-shadow:var(--sh-md);}
  .dcard__h{display:flex;align-items:center;gap:9px;padding:9px 13px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#FCFDFB,#fff);}
  .dcard__n{width:22px;height:22px;border-radius:7px;background:var(--forest);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:.82rem;flex:0 0 auto;box-shadow:0 2px 5px rgba(22,61,42,.2);}
  .dcard__t{font-family:var(--sans);font-weight:700;font-size:.92rem;letter-spacing:-.01em;flex:1;min-width:0;line-height:1.15;}
  .dcard__t small{display:block;font-weight:400;font-size:.68rem;color:var(--faint);margin-top:1px;}
  .dcard__more{color:var(--leaf-deep);background:var(--leaf-soft);border:0;font-size:.64rem;font-weight:600;font-family:var(--sans);white-space:nowrap;flex:0 0 auto;padding:.3em .65em;border-radius:100px;transition:background .14s;}
  .dcard__more:hover{background:#DAE9DB;}
  .dcard__b{padding:11px 13px;flex:1;min-height:0;}

  /* merged care plan + actions */
  .rc-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:820px){.rc-grid{grid-template-columns:1fr;}}
  .rc-sub{font-family:var(--mono);font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--leaf-deep);margin-bottom:6px;}
  .rc-right{border-left:1px solid var(--line);padding-left:18px;}
  @media(max-width:820px){.rc-right{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:12px;}}
  /* knowledge two-col */

  /* sparkline for a lab value across the 5 consults */
  /* proper monitoring chart: line over the 5 visits, with y-axis, gridlines, optional target band, point labels */
  function monitorChart(opts){
    // opts: {vals:[], labels:[], color, unit, target:[lo,hi]|null, targetColor, yMinPad, decimals}
    const vals=opts.vals, labels=opts.labels||vals.map((_,i)=>'V'+(i+1));
    const color=opts.color||'#3E9161';
    const decimals=opts.decimals||0;
    const W=300,H=150, padL=34, padR=10, padT=14, padB=22;
    const iw=W-padL-padR, ih=H-padT-padB;
    let lo=Math.min(...vals), hi=Math.max(...vals);
    if(opts.target){ lo=Math.min(lo,opts.target[0]); hi=Math.max(hi,opts.target[1]); }
    const span=(hi-lo)||1; lo-=span*0.18; hi+=span*0.18;
    const x=i=>padL+iw*(i/(vals.length-1));
    const y=v=>padT+ih*(1-(v-lo)/(hi-lo));
    // y gridlines (3)
    let grid='', ylabels='';
    for(let g=0;g<=2;g++){ const val=lo+(hi-lo)*(g/2); const yy=y(val); grid+=`<line x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}" stroke="#EEF1EB" stroke-width="1"/>`; ylabels+=`<text x="${padL-6}" y="${(yy+3).toFixed(1)}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="8" fill="#8A968C">${val.toFixed(decimals)}</text>`; }
    // target band
    let band='';
    if(opts.target){ const y1=y(opts.target[1]), y2=y(opts.target[0]); band=`<rect x="${padL}" y="${Math.min(y1,y2).toFixed(1)}" width="${iw}" height="${Math.abs(y2-y1).toFixed(1)}" fill="${opts.targetColor||'rgba(62,145,97,.10)'}"/>`; }
    // line + area
    const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const area=`M ${x(0).toFixed(1)},${(padT+ih).toFixed(1)} L `+vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' L ')+` L ${x(vals.length-1).toFixed(1)},${(padT+ih).toFixed(1)} Z`;
    // points + x labels
    let dots='', xlabels='';
    vals.forEach((v,i)=>{ const last=i===vals.length-1; dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${last?3.6:2.8}" fill="${last?color:'#fff'}" stroke="${color}" stroke-width="1.8"/>`; xlabels+=`<text x="${x(i).toFixed(1)}" y="${H-7}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="8" fill="#8A968C">${labels[i]}</text>`; });
    // last value callout
    const lv=vals[vals.length-1];
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img">
      ${band}${grid}
      <path d="${area}" fill="${color}" opacity=".07"/>
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}${ylabels}${xlabels}
    </svg>`;
  }

  function labTrendSVG(key,invert){
    const p=P(); const vals=p.consults.map(c=>c.labs[key]);
    const min=Math.min(...vals), max=Math.max(...vals), rng=(max-min)||1;
    const W=280,H=48,pad=6;
    const pts=vals.map((v,i)=>{ const x=pad+(W-2*pad)*(i/(vals.length-1)); const y=pad+(H-2*pad)*(1-(v-min)/rng); return `${x.toFixed(1)},${y.toFixed(1)}`; }).join(' ');
    const last=pts.split(' ').pop().split(',');
    return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="44" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="#3E9161" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${last[0]}" cy="${last[1]}" r="3.4" fill="#2E7449"/></svg>`;
  }

              <div style="border:1px solid var(--line);border-radius:12px;padding:14px;background:#FCFDFB"><div style="font-family:var(--mono);font-size:.62rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em">BMI</div><div style="font-family:var(--serif);font-size:1.5rem;color:var(--forest)">${latest.labs.bmi}</div><div style="font-size:.76rem;color:var(--muted);font-family:var(--sans)">overweight</div></div>
              <div style="border:1px solid var(--line);border-radius:12px;padding:14px;background:#FCFDFB"><div style="font-family:var(--mono);font-size:.62rem;color:var(--faint);text-transform:uppercase;letter-spacing:.08em">Actions done</div><div style="font-family:var(--serif);font-size:1.5rem;color:var(--forest)">${goalsMet}/${latest.actions.length}</div><div style="font-size:.76rem;color:var(--muted);font-family:var(--sans)">this cycle</div></div>
            </div>
          </div>
        </section>
        <section class="card">
          <div class="card__h"><span class="tag">Monitoring</span><h3>Renal markers over 3 months</h3><button class="link hspace" data-ptab="consultations">All consultations ${svg(I.arrowR)}</button></div>

              ${(()=>{const p=P();const vl=p.consults.map(x=>'V'+x.n);const L=p.consults[p.consults.length-1].labs;
                const mk=(title,key,color,unit,tgt,dec,now,cls)=>`<div class="m4-chart"><div class="m4-chart__h"><b>${title}</b><span class="now ${cls}">${now}</span></div><div class="m4-chart__sub">${tgt?'<span class="band"></span> ':''}${unit}</div>${monitorChart({vals:p.consults.map(x=>key==='bp'?parseInt(x.labs.bp):x.labs[key]),labels:vl,color,target:tgt,decimals:dec})}</div>`;

  function apptListHTML(){
    const p=P();
    if(!p.appointments.length) return `<div class="empty">${svg(I.cal)}<div>No appointments scheduled</div></div>`;
    return p.appointments.map(a=>{
      const d = a.date instanceof Date ? a.date : new Date(a.date);
      const isToday = a.status==='today';
      return `<div style="display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)">
        <div style="text-align:center;min-width:52px"><div style="font-family:var(--serif);font-size:1.4rem;color:var(--forest);line-height:1">${fmtDay(d)}</div><div style="font-family:var(--mono);font-size:.64rem;color:var(--faint);text-transform:uppercase">${fmtMon(d)}</div></div>
        <div style="flex:1"><div style="font-family:var(--sans);font-weight:600;font-size:.9rem">${a.time} · ${esc(a.type)}</div><div style="font-family:var(--sans);font-size:.78rem;color:var(--muted)">${a.duration} min ${isToday?'· <span style="color:var(--leaf-deep);font-weight:600">Today</span>':''}</div></div>

  function activeConsult(){ const p=P(); return p.consults.find(c=>c.id===state.activeConsult) || p.consults[p.consults.length-1]; }

  function pCarePlan(){
    const p=P(); const c=activeConsult();
    const opts = p.consults.map(x=>`<option value="${x.id}" ${x.id===c.id?'selected':''}>Visit ${x.n} · ${fmtDate(x.date)}${x.status==='pending'?' (current)':''}</option>`).join('');
    const iconFor = t=>({protein:I.protein,salt:I.salt,leaf:I.heart,energy:I.energy})[t]||I.heart;
    const lines = c.plan.map(l=>{
      const s=SOURCES[l.src];
      return `<div class="planline ${l.flagged?'flagged':''}" data-line="${l.id}">
        <div class="planline__i">${svg(iconFor(l.icon))}</div>
        <div class="planline__b">
          <div class="planline__txt">${l.text}</div>
          <div class="planline__meta">
            <button class="srcbtn" data-src="${l.src}">${esc(s.label)}</button>
            ${l.flagged?`<span class="flagnote">${svg(I.warn)} Conflicts with an earlier note (target was higher) — resolve before approving</span>`:''}
          </div>
        </div>
        <div class="planline__act">
          <button class="lact" data-edit-line="${l.id}" title="Edit">${svg(I.edit)}</button>
          <button class="lact" data-del-line="${l.id}" title="Remove">${svg(I.trash)}</button>

    return `

      <div>
        <section class="card">
          <div class="card__h"><span class="tag">Care plan</span><h3>Recommendations</h3>

            </div>
            <div class="approve">
              <span class="approve__txt" id="approveTxt">${approved?`Approved by ${esc(c.approvedBy)} on ${esc(c.approvedOn)}.`:'<b>Ready for your approval.</b> Nothing reaches the record until you sign off.'}</span>
              ${approved
                ? `<span class="approved-stamp" style="display:inline-flex">${svg(I.check)} Approved &amp; filed</span>`
                : `<button class="btn-sm" data-act="edit-note">Edit note</button><button class="btn-sm amber" data-act="approve-plan">Approve &amp; save</button>`}
            </div>
          </div>

      <aside>

    </div>`;

  /* ============================================================
     RENDER
  ============================================================ */
  function render(){
    if(state.screen==='landing'){
      root.innerHTML = landing();
      renderPeek();   // mount the live four-module cockpit into the hero preview
    } else {
      let inner='';
      if(state.tab==='dashboard') inner=dashboard();
      else if(state.tab==='patients') inner=patientsList();
      else if(state.tab==='patient') inner=patientWorkspace();
      else if(state.tab==='knowledge') inner=knowledgeScreen();
      else if(state.tab==='schedule') inner=scheduleScreen();
      else if(state.tab==='invoices') inner=invoicesScreen();
      root.innerHTML = shell(inner) + kbPanelHTML();
      wireKbPanel();
      if(state.tab==='patient' && (state.patientTab==='cockpit'||state.patientTab==='assessment'||state.patientTab==='careplan')) playAgents();
    }
    window.scrollTo(0,0);
  }

  function rerenderPatientBody(){
    const body=document.getElementById('ptabbody');
    if(body){ body.innerHTML=patientTabBody(); }
    // update tab active states
    document.querySelectorAll('.ptab').forEach(t=>t.classList.toggle('on', t.getAttribute('data-ptab')===state.patientTab));

  /* ---------- agent animation ---------- */
  function playAgents(){
    if(reduce) return;
    const scan=document.querySelector('.scan');
    if(scan) scan.animate([{top:'8%',opacity:0},{top:'12%',opacity:1,offset:.1},{top:'88%',opacity:1,offset:.9},{top:'92%',opacity:0}],{duration:1000,easing:'ease-in-out'});
  }

  /* ============================================================
     KNOWLEDGE ASSISTANT logic
  ============================================================ */
  const kbAnswers=[
    {k:['weight-loss','weight loss','lose weight','weekly target','rate of','how much weight'],a:"A sustainable rate is <b>0.5–1 kg per week</b> (about 5–10% of body weight over 6 months), through a modest <b>500–750 kcal/day</b> deficit plus regular activity. Faster loss is harder to maintain and risks muscle loss.",s:['clinical','national']},
    {k:['protein','muscle','preserve','lean'],a:"During weight loss, aim for <b>1.2–1.6 g protein/kg/day</b> to preserve lean muscle, spread across meals, alongside resistance activity. Prioritise lean meats, fish, eggs, legumes and dairy.",s:['clinical']},
    {k:['fibre','fiber'],a:"Target <b>≥30 g fibre/day</b> from wholegrains, legumes, vegetables and fruit. Fibre improves satiety and helps with weight control and glycaemic response. Increase gradually with adequate fluids.",s:['national','foodkg']},
    {k:['portion','plate','serving','how much'],a:"Use the <b>balanced-plate</b> guide: ½ vegetables/salad, ¼ lean protein, ¼ wholegrain carbs, with a thumb of healthy fat. It controls energy without weighing every food.",s:['national','foodkg']},
    {k:['sugar','free sugar','sweet'],a:"Keep <b>free sugars under ~5–10%</b> of daily energy. Swap sugary drinks for water, and choose whole fruit over juice. This is one of the highest-impact changes for weight.",s:['national','clinical']},
    {k:['activity','exercise','steps','move'],a:"Combine diet with <b>150–300 min/week</b> of moderate activity plus 2 resistance sessions. Activity protects muscle during weight loss and supports long-term maintenance.",s:['clinical','national']}
  ];
  function kbReply(q){ const ql=q.toLowerCase(); for(const a of kbAnswers){ if(a.k.some(k=>ql.indexOf(k)>-1)) return a; } return {a:"I answer from clinical and national guidelines — try asking about a realistic weight-loss rate, protein to preserve muscle, fibre targets, portion guidance, free sugars, or activity.",s:['clinical','national']}; }

  function wireKbPanel(){
    const panel=document.getElementById('kbpanel'), fab=document.getElementById('kbfab'), chat=document.getElementById('kbChat');
    if(!panel) return;
    const open=()=>{panel.classList.add('open'); setTimeout(()=>{const i=document.getElementById('kbInput'); if(i) i.focus();},180);};
    const close=()=>panel.classList.remove('open');
    fab.onclick=()=>panel.classList.contains('open')?close():open();
    document.getElementById('kbClose').onclick=close;
    function addUser(t){const d=document.createElement('div');d.className='msg user';d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
    function addTyping(){const d=document.createElement('div');d.className='kbtyping';d.id='kbTyping';d.innerHTML='<i></i><i></i><i></i>';chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
    function addBot(ans){const t=document.getElementById('kbTyping');if(t)t.remove();const d=document.createElement('div');d.className='msg bot';const src=ans.s.map(s=>`<a data-src="${s}">${esc(SOURCES[s].label)}</a>`).join('');d.innerHTML=ans.a+`<div class="src">${src}</div>`;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
    window._kbAsk=function(q){ if(!q.trim())return; open(); addUser(q); addTyping(); setTimeout(()=>addBot(kbReply(q)), reduce?150:650); };
    document.getElementById('kbForm').onsubmit=e=>{e.preventDefault();const i=document.getElementById('kbInput');window._kbAsk(i.value);i.value='';};
    document.querySelectorAll('#kbSug button').forEach(b=>b.onclick=()=>window._kbAsk(b.getAttribute('data-q')));
  }

  /* ============================================================
     ACTIONS / EVENT DELEGATION
  ============================================================ */
  document.addEventListener('click', function(e){
    const t=e.target;
    const closest=(sel)=>t.closest(sel);

    if(closest('[data-close-modal]')){ closeModal(); return; }

    // login/logout
    if(closest('[data-act="login"]')){ state.screen='app'; state.tab='dashboard'; render(); return; }
    if(closest('[data-act="logout"]')){ state.screen='landing'; render(); return; }

    // nav
    const navBtn=closest('[data-nav]');
    if(navBtn){ state.tab=navBtn.getAttribute('data-nav'); if(state.tab==='patient'){ state.patientTab='cockpit'; state.activeConsult=null; } render(); return; }

    // open patient (from lists/schedule/dashboard)
    const openP=closest('[data-open-patient]');
    if(openP){
      const pid=openP.getAttribute('data-open-patient');
      if(pid==='jdoe'){
        state.tab='patient';
        state.activeConsult=null;
        state.patientTab = openP.getAttribute('data-goto') || (openP.getAttribute('data-goto-careplan')?'careplan':'overview');
        render();
      } else {
        // shallow patients — friendly message

    const ptab=closest('[data-ptab]');
    if(ptab){ state.patientTab=ptab.getAttribute('data-ptab'); if(state.patientTab==='careplan'||state.patientTab==='assessment'||state.patientTab==='cockpit') state.activeConsult=state.activeConsult||null; rerenderPatientBody(); if(state.patientTab==='cockpit'||state.patientTab==='assessment'||state.patientTab==='careplan') playAgents(); return; }

    // source popups
    const srcBtn=closest('[data-src]');
    if(srcBtn){ showSource(srcBtn.getAttribute('data-src')); return; }

    // ===== CARE PLAN editing =====
    const delLine=closest('[data-del-line]');
    if(delLine){ const id=delLine.getAttribute('data-del-line'); const c=activeConsult(); c.plan=c.plan.filter(l=>l.id!==id); rerenderPatientBody(); toast('Recommendation removed'); return; }

    const editLine=closest('[data-edit-line]');

    if(closest('[data-act="add-line"]')){ addLineModal(); return; }

    if(closest('[data-act="approve-plan"]')){ approvePlan(); return; }
    if(closest('[data-act="edit-note"]')){ editNoteModal(); return; }

    // consult selector handled by change event; open specific consult
    const openC=closest('[data-open-consult]');
    if(openC){ state.activeConsult=openC.getAttribute('data-open-consult'); state.patientTab='careplan'; rerenderPatientBody(); playAgents(); return; }

    // ===== ASSESSMENT editing =====
    const delFood=closest('[data-del-food]');
    if(delFood){ const i=+delFood.getAttribute('data-del-food'); const c=activeConsult(); c.meal.items.splice(i,1); recalcMeal(c); rerenderPatientBody(); toast('Item removed'); return; }
    if(closest('[data-act="add-food"]')){ addFoodModal(); return; }
    if(closest('[data-act="save-assessment"]')){ saveAssessment(); return; }

    // ===== ACTIONS =====
    const tog=closest('[data-toggle-action]');
    if(tog){ const id=tog.getAttribute('data-toggle-action'); const c=activeConsult(); const a=c.actions.find(x=>x.id===id); if(a){a.done=!a.done;} rerenderPatientBody(); return; }
    const delA=closest('[data-del-action]');
    if(delA){ const id=delA.getAttribute('data-del-action'); const c=activeConsult(); c.actions=c.actions.filter(x=>x.id!==id); rerenderPatientBody(); toast('Action removed'); return; }
    const editA=closest('[data-edit-action]');
    if(editA){ editActionModal(editA.getAttribute('data-edit-action')); return; }
    if(closest('[data-act="add-action"]')){ addActionModal(); return; }
    if(closest('[data-act="share-actions"]')){ toast('Action plan shared with patient'); return; }

    // ===== NOTES =====
    const saveNote=closest('[data-save-note]');
    if(saveNote){ const id=saveNote.getAttribute('data-save-note'); const ta=document.querySelector(`textarea[data-note="${id}"]`); const c=P().consults.find(x=>x.id===id); if(c&&ta){ c.note=ta.value; c.summary=ta.value.slice(0,120)+(ta.value.length>120?'…':''); } toast('Note saved'); return; }

    // ===== SCHEDULING =====
    if(closest('[data-act="book-appt"]')){ bookApptModal(); return; }
    const resch=closest('[data-reschedule]');
    if(resch){ rescheduleModal(resch.getAttribute('data-reschedule')); return; }
    const cancel=closest('[data-cancel-appt]');
    if(cancel){ const id=cancel.getAttribute('data-cancel-appt'); const p=P(); p.appointments=p.appointments.filter(a=>a.id!==id); refreshApptLists(); toast('Appointment cancelled'); return; }

    // ===== INVOICES =====
    if(closest('[data-act="new-invoice"]')){ newInvoiceModal(); return; }
    const openInv=closest('[data-open-invoice]');
    if(openInv){ invoiceDetailModal(openInv.getAttribute('data-open-invoice')); return; }

    // ===== consults / misc =====
    if(closest('[data-act="start-consult"]')||closest('[data-act="new-consult"]')){ startConsultModal(); return; }

    if(closest('[data-act="add-patient"]')){ toast('New patient form (demo)'); return; }
    if(closest('[data-act="dismiss-approval"]')){ const el=closest('.approval'); if(el){el.style.transition='opacity .3s,transform .3s';el.style.opacity='0';el.style.transform='translateY(-6px)';setTimeout(()=>el.remove(),300);} return; }

    // knowledge page
    if(closest('[data-act="kb-page-ask"]')){ const i=document.getElementById('kbPageInput'); if(window._kbAsk){window._kbAsk(i.value);} i.value=''; return; }
    if(closest('[data-act="ck-chat"]')){ const i=document.getElementById('ckChatIn'); if(i&&window._kbAsk){window._kbAsk(i.value);} if(i)i.value=''; return; }
    const ckSug=closest('.d-chat__sug button'); if(ckSug){ if(window._kbAsk) window._kbAsk(ckSug.getAttribute('data-q')); return; }
    const kbchip=closest('.kbchip'); if(kbchip){ if(window._kbAsk) window._kbAsk(kbchip.getAttribute('data-q')); return; }
    const kbitem=closest('.kbitem[data-src]'); if(kbitem){ showSource(kbitem.getAttribute('data-src')); return; }

    // landing nav scroll shadow handled below
  });

      <div class="field"><label>Recommendation text</label><textarea id="m-linetext">${esc(plain)}</textarea></div>
      <div class="field"><label>Linked source (for traceability)</label><select id="m-linesrc">${srcOpts}</select></div>
      <div class="field"><label style="display:flex;align-items:center;gap:.5em"><input type="checkbox" id="m-lineflag" ${l.flagged?'checked':''} style="width:auto"> Flag this line for review (conflict)</label></div>

    document.getElementById('m-save-line').onclick=()=>{

  function approvePlan(){
    const c=activeConsult();
