    if(flag){
      openModal(modalShell('Resolve','Conflict must be resolved',`
        <div class="src-detail">
          <p style="font-family:var(--sans);color:var(--ink);line-height:1.6">The verification agent flagged a <b>sodium target conflict</b>. Today's plan sets <b>&lt;2 g/day</b>, but an earlier note recorded a higher target (2.3 g/day).</p>
          <div class="quote" style="font-style:normal">Choose how to resolve before approving:</div>
        </div>
        <div class="field"><label>Resolution</label><select id="m-resolve">
          <option value="keep">Keep &lt;2 g/day (align with KDIGO 2024)</option>
          <option value="old">Revert to earlier 2.3 g/day target</option>
        </select></div>
      `,`<button class="btn-sm" data-close-modal>Cancel</button><button class="btn-sm amber" id="m-resolve-btn">Resolve &amp; continue</button>`));
      document.getElementById('m-resolve-btn').onclick=()=>{
        const choice=document.getElementById('m-resolve').value;
        c.plan.forEach(l=>{ if(l.flagged){ l.flagged=false; if(choice==='old'){ l.text=l.text.replace('&lt;2 g/day','&lt;2.3 g/day').replace('<b>2 g/day</b>','<b>2.3 g/day</b>'); } } });
        closeModal();
        rerenderPatientBody();
        toast('Conflict resolved — you can now approve');
      };
      return;
    }
    // sign-off modal
    openModal(modalShell('Approve','Approve & file care plan',`
      <div class="src-detail">
        <p style="font-family:var(--sans);color:var(--ink);line-height:1.6">You're approving the care plan for <b>${P().first} ${P().last}</b>, Visit ${c.n}. Once signed off, it is filed to the record with your name and timestamp.</p>

      <div class="field"><label style="display:flex;align-items:center;gap:.5em"><input type="checkbox" id="m-confirm" checked style="width:auto"> I confirm I have reviewed every recommendation and its source</label></div>
    `,`<button class="btn-sm" data-close-modal>Cancel</button><button class="btn-sm amber" id="m-approve-btn">Sign &amp; file</button>`));

      closeModal(); rerenderPatientBody(); toast('Care plan approved & filed to record');

    openModal(modalShell('Consultation','Start new consultation',`
      <div class="field"><label>Patient</label><input value="John Doe" disabled></div>
      <p style="font-family:var(--sans);color:var(--muted);line-height:1.6;font-size:.88rem">This opens a fresh consultation for today. In the full product, the multi-agent team analyses the new intake and drafts a care plan for your review. For this demo, you'll be taken to the current visit's workspace.</p>
    `,`<button class="btn-sm" data-close-modal>Cancel</button><button class="btn-sm amber" id="m-startc">Open workspace</button>`));
    document.getElementById('m-startc').onclick=()=>{ closeModal(); state.tab='patient'; state.patientTab='careplan'; state.activeConsult=P().consults[P().consults.length-1].id; render(); };
  }

  /* ============================================================
     BOOT
  ============================================================ */
  // Present-mode exit (button lives outside the re-rendered root)

  // Live cockpit preview on the landing page (real UI, scaled to fit the browser mock)
  function renderPeek(){
    const scale=document.getElementById('peekScale'), frame=document.getElementById('peekLive');
    if(!scale||!frame) return;
    // render the four-module cockpit for John Doe into the preview
    const prevTab=state.tab, prevPT=state.patientTab, prevAC=state.activeConsult;
    state.tab='patient'; state.patientTab='cockpit'; state.activeConsult=null;
    scale.innerHTML='<div class="app"><main class="main">'+pCockpit()+'</main></div>';
    state.tab=prevTab; state.patientTab=prevPT; state.activeConsult=prevAC;
    // scale 1440px content down to the frame width
    const fit=()=>{ const w=frame.clientWidth; if(!w) return; const s=w/1440; scale.style.transform='scale('+s+')'; scale.style.height=(frame.clientHeight/s)+'px'; };
    fit(); requestAnimationFrame(fit); window.addEventListener('resize',fit,{passive:true});
  }

  render();          // landing render also mounts the live cockpit preview
})();
</script>
</body>
</html>
